<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serverless Pipeline Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f5f5f5; color: #1a1a1a; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 20px; }
    .metric { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e5; }
    .metric .label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .metric .val { font-size: 24px; font-weight: 600; }
    .card { background: #fff; border-radius: 10px; padding: 20px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .card h2 { font-size: 14px; color: #555; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; background: #f9f9f9; color: #666; border-bottom: 1px solid #eee; }
    td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .ok  { background: #e6f7ee; color: #0a7c3e; }
    .err { background: #fde8e8; color: #b91c1c; }
    button { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
             background: #1a1a1a; color: #fff; font-size: 13px; margin-right: 8px; }
    button.secondary { background: #f0f0f0; color: #1a1a1a; }
    #status { font-size: 13px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Serverless Pipeline Dashboard</h1>

  <div class="metrics">
    <div class="metric"><div class="label">Total records</div><div class="val" id="m-total">—</div></div>
    <div class="metric"><div class="label">Successful</div><div class="val" id="m-ok" style="color:#0a7c3e">—</div></div>
    <div class="metric"><div class="label">Errors</div><div class="val" id="m-err" style="color:#b91c1c">—</div></div>
    <div class="metric"><div class="label">Last updated</div><div class="val" id="m-time" style="font-size:14px">—</div></div>
  </div>

  <div class="card">
    <h2>Actions</h2>
    <button onclick="loadRecords()">Refresh records</button>
    <button class="secondary" onclick="triggerProcess()">Trigger test run</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Processed files — DynamoDB</h2>
    <table>
      <thead><tr><th>File name</th><th>Type</th><th>Size</th><th>Processed at</th><th>Status</th></tr></thead>
      <tbody id="records-body"><tr><td colspan="5" style="color:#aaa;padding:20px 10px">Loading...</td></tr></tbody>
    </table>
  </div>

  <script>
    const API = 'https://yz8eek5eq8.execute-api.ap-south-1.amazonaws.com/prod'; // <-- replace this

    async function loadRecords() {
      document.getElementById('status').textContent = 'Fetching records...';
      try {
        const res   = await fetch(`${API}/records`);
        const items = await res.json();
        const body  = document.getElementById('records-body');

        if (!items.length) {
          body.innerHTML = '<tr><td colspan="5" style="color:#aaa;padding:20px 10px">No records yet. Upload a file to S3 to start.</td></tr>';
        } else {
          body.innerHTML = items.map(item => `
            <tr>
              <td>${item.fileName}</td>
              <td>${item.fileType || '—'}</td>
              <td>${item.fileSize ? (item.fileSize/1024).toFixed(1)+' KB' : '—'}</td>
              <td>${new Date(item.processedAt).toLocaleString()}</td>
              <td><span class="pill ${item.status==='SUCCESS'?'ok':'err'}">${item.status}</span></td>
            </tr>`).join('');
        }

        document.getElementById('m-total').textContent = items.length;
        document.getElementById('m-ok').textContent   = items.filter(i=>i.status==='SUCCESS').length;
        document.getElementById('m-err').textContent  = items.filter(i=>i.status!=='SUCCESS').length;
        document.getElementById('m-time').textContent = new Date().toLocaleTimeString();
        document.getElementById('status').textContent = 'Updated.';
      } catch(e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
      }
    }

    async function triggerProcess() {
      document.getElementById('status').textContent = 'Triggering pipeline...';
      try {
        const res  = await fetch(`${API}/process`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: `test-${Date.now()}.csv`, fileSize: 2048 })
        });
        const data = await res.json();
        document.getElementById('status').textContent = 'Done! fileId: ' + data.fileId;
        await loadRecords();
      } catch(e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
      }
    }

    loadRecords();
  </script>
</body>
</html>
